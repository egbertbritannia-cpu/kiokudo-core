openapi: 3.0.3
info:
  title: Kiokudo Core — Grammar / JPD133 / IELTS
  version: 0.3.0-staging
  description: >-
    Flashcard creation, card catalog HTTP access and FSRS review APIs are retired.
    Historical cards and review logs may remain in the migration database.
    Only a verified single-owner staged dataset may serve private learning data.
paths:
  /api/v1/health:
    get:
      summary: Public process liveness
      responses: {'200': {description: Process reachable}}
  /api/v1/status:
    get:
      summary: Service status (service bearer)
      security: [{ServiceBearer: []}]
      responses: {'200': {description: Staging status}}
  /api/v1/grammar:
    get:
      summary: Grammar lesson catalog and summaries
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Grammar catalog}}
  /api/v1/grammar/{lessonId}:
    get:
      summary: Grammar lesson with patterns
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      parameters: [{in: path, name: lessonId, required: true, schema: {type: string}}]
      responses: {'200': {description: Grammar lesson}, '404': {description: Unknown lesson}}
  /api/v1/grammar/practice:
    get:
      summary: Practice exercises
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Practice questions}}
  /api/v1/grammar/practice/attempts:
    post:
      summary: Save validated exercise attempt (writes explicitly gated)
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Attempt recorded}, '403': {description: Writes disabled}}
  /api/v1/curriculum/jpd133/mappings:
    get:
      summary: Read verified curriculum mapping metadata
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Curriculum mappings}}
    post:
      summary: Import verified curriculum mapping (operator gated)
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'201': {description: Imported}, '403': {description: Import disabled}}
  /api/v1/ielts/dashboard:
    get:
      summary: IELTS learning overview
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Dashboard}}
  /api/v1/ielts/materials:
    get:
      summary: IELTS materials
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Materials}}
  /api/v1/ielts/sessions:
    get:
      summary: IELTS sessions
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Sessions}}
    post:
      summary: Create an IELTS session
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'201': {description: Session created}}
  /api/v1/ielts/sessions/{id}:
    get:
      summary: Session and recorded practice logs
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Session detail}, '404': {description: Session not found}}
  /api/v1/ielts/sessions/{id}/draft:
    put:
      summary: Store IELTS draft by revision
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Draft saved}}
  /api/v1/ielts/sessions/{id}/submit:
    post:
      summary: Submit IELTS session
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Submitted}}
  /api/v1/ielts/mistakes:
    get:
      summary: List recorded mistakes
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Mistakes}}
    post:
      summary: Record a mistake
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'201': {description: Mistake recorded}}
  /api/v1/ielts/vocab:
    get:
      summary: List recorded vocabulary
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'200': {description: Vocabulary}}
    post:
      summary: Record IELTS vocabulary
      security: [{ServiceBearer: [], OwnerAssertion: []}]
      responses: {'201': {description: Vocabulary recorded}}
components:
  securitySchemes:
    ServiceBearer: {type: http, scheme: bearer}
    OwnerAssertion: {type: apiKey, in: header, name: x-kiokudo-owner-assertion}
